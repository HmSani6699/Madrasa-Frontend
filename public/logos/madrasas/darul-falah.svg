<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Darul Falah Islamic Cadet Academy Shield -->
  <circle cx="60" cy="60" r="56" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>

  <!-- Cadet Shield -->
  <path d="M35 34 L85 34 C85 34 87 64 60 85 C33 64 35 34 35 34 Z" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>

  <!-- Cadet Laurel / Stars of Distinction -->
  <polygon points="46,42 47.5,39 49,42 45.5,40.5 50.5,40.5" fill="#f59e0b"/>
  <polygon points="60,39 61.5,36 63,39 59.5,37.5 64.5,37.5" fill="#f59e0b"/>
  <polygon points="74,42 75.5,39 77,42 73.5,40.5 78.5,40.5" fill="#f59e0b"/>

  <!-- Crossed Quill / Pen of Wisdom -->
  <line x1="48" y1="58" x2="72" y2="46" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="58" x2="48" y2="46" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

  <!-- Open Quran on Shield -->
  <path d="M60 55 C54 51 46 51 40 54 L40 68 C46 65 54 65 60 69 C66 65 74 65 80 68 L80 54 C74 51 66 51 60 55 Z" fill="#115e59"/>
  <path d="M60 57 C54 53 47 53 42 56 L42 66 C47 63 54 63 60 67 C66 63 73 63 78 66 L78 56 C73 53 66 53 60 57 Z" fill="#ccfbf1"/>

  <text x="60" y="24" text-anchor="middle" fill="#ccfbf1" font-size="7" font-weight="bold" font-family="sans-serif">دار الفلاح الإسلامية</text>
  <text x="60" y="105" text-anchor="middle" fill="#ccfbf1" font-size="7.5" font-weight="bold" font-family="sans-serif">২০১৫ • ক্যাডেট একাডেমি</text>
</svg>