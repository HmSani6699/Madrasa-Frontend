    <line x1="60" y1="36" x2="60" y2="28"/>
    <line x1="50" y1="38" x2="44" y2="32"/>
    <line x1="70" y1="38" x2="76" y2="32"/>
    <line x1="42" y1="45" x2="35" y2="42"/>
