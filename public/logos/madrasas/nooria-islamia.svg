  <path d="M60 69 C54 65 47 65 40 68 L40 76 C47 73 54 73 60 77 C66 73 73 73 80 76 L80 68 C73 65 66 65 60 69 Z" fill="#fef3c7"/>
  <line x1="60" y1="69" x2="60" y2="77" stroke="#d97706" stroke-width="1.5"/>

  <!-- Rehal Stand -->
  <path d="M48 79 L72 91 M72 79 L48 91" stroke="#92400e" stroke-width="2.5" stroke-linecap="round"/>

  <text x="60" y="24" text-anchor="middle" fill="#d1fae5" font-size="7" font-weight="bold" font-family="sans-serif">جامعة نورية اسلامية</text>
  <text x="60" y="105" text-anchor="middle" fill="#d1fae5" font-size="7.5" font-weight="bold" font-family="sans-serif">১৯৪১ • আশরাফাবাদ</text>
</svg>